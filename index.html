<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindFlow</title>
    <script type="module" crossorigin src="/mindflow-web/assets/index-C5dbBtbZ.js"></script>
    <link rel="stylesheet" crossorigin href="/mindflow-web/assets/index-DbLSXwqB.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- 打倒旧版 Service Worker：注销全部 SW + 清空缓存（防 PWA 旧版缓存锁死） -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        });
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      }
    </script>
  </body>
</html>
